name: daily-forecast

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 08:00 CDT
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python daily.py
      - name: Commit forecast
        run: |
          git config user.name  "dove-forecaster"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || \
            git commit -m "forecast $(date -u +%Y-%m-%d)"
          git push
