name: daily-forecast

on:
  schedule:
    - cron: "23 12 * * *"   # 12:23 UTC = 07:23 CDT. Deliberately an odd
                            # minute: GitHub's scheduler is swamped on the hour
                            # and round-time jobs get delayed or dropped.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python daily.py
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      - run: python build_sites.py
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      - run: python dashboard.py
      - name: Commit forecast
        run: |
          git config user.name  "dove-forecaster"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "forecast $(date -u +%Y-%m-%d)"
          # another run may have landed while we were fetching weather
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
