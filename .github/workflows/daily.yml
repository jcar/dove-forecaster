name: daily-forecast

on:
  schedule:
    - cron: "23 12 * * *"   # 12:23 UTC = 07:23 CDT. Deliberately an odd
                            # minute: GitHub's scheduler is swamped on the hour
                            # and round-time jobs get delayed or dropped.
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Rebuild and publish the site only - no audit-trail forecast, no eBird pull"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The weather history cache lives on its own branch, force-pushed as a
      # single commit each morning: 2,062 files rewritten daily would add
      # hundreds of MB a season to master's history (D29).
      - name: Restore weather cache
        run: |
          git fetch --depth=1 origin wxcache && git worktree add /tmp/wx FETCH_HEAD \
            && mkdir -p data/wxcache && cp -r /tmp/wx/data/wxcache/. data/wxcache/ \
            || echo "no wxcache branch yet - starting from master's copy"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # daily.py is the AUDIT TRAIL - the tracked forecast, committed before
      # anyone knows how it turned out. It must never be discarded because a
      # later step failed, which is exactly what happened on 2026-09-14.
      - name: Forecast (audit trail)
        id: daily
        if: ${{ !inputs.publish_only }}
        run: python daily.py
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}

      # New lattice nodes start with 4 days of history (ECMWF keeps no more);
      # spend the now-idle Open-Meteo quota filling them in. Never fatal.
      - name: Backfill weather history for new grid points
        continue-on-error: true
        run: python backfill_history.py

      # The public fan-out is best-effort. Weather comes from ECMWF open data
      # (one download, any number of locations); Open-Meteo fills gaps.
      - name: Build all locations
        id: sites
        continue-on-error: true
        run: python build_sites.py
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}

      # docs/ is not committed any more (D23), so a failed build must not
      # deploy an empty site: serve what is live now instead.
      - name: Keep yesterday's locations if today's build failed
        if: steps.sites.outcome == 'failure'
        continue-on-error: true
        run: python restore_published.py

      - name: Render page
        id: render
        run: python dashboard.py

      # Every flyway's forecasts against eBird counts - the publishing rule (D24).
      - name: Grade forecasts
        continue-on-error: true
        run: python grade.py

      - name: Commit forecast and history
        if: always() && (steps.daily.outcome == 'success' || inputs.publish_only)
        run: |
          git config user.name  "dove-forecaster"
          git config user.email "actions@users.noreply.github.com"
          git add data/        # data/wxcache is gitignored; it lives on its own branch
          if git diff --staged --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "forecast $(date -u +%Y-%m-%d)"
          # another run may have landed while we were fetching weather
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save weather cache
        if: always() && (steps.daily.outcome == 'success' || inputs.publish_only)
        run: |
          rm -rf /tmp/wxpub && mkdir -p /tmp/wxpub/data && cp -r data/wxcache /tmp/wxpub/data/
          cd /tmp/wxpub && git init -q && git checkout -q -b wxcache
          git config user.name "dove-forecaster" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "weather cache $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" wxcache

      # Publishing never waits on the commit: a git hiccup must not take the site down.
      - uses: actions/configure-pages@v5
        if: always() && steps.render.outcome == 'success'
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.render.outcome == 'success'
        with:
          path: docs
      - name: Publish site
        id: deploy
        if: always() && steps.render.outcome == 'success'
        uses: actions/deploy-pages@v4

      # Surface a partial build loudly rather than letting a green tick imply
      # the whole thing ran.
      - name: Flag partial build
        if: steps.sites.outcome == 'failure'
        run: |
          echo "::warning::Location build failed; yesterday's locations were re-published and the audit-trail forecast was still committed."
          exit 1
